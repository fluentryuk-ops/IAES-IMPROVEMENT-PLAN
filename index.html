<title>IAES Improvement Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: a working console. Sticky header with sync state, tab bar, one active view.
   Navy and gold are the school's colours; red, amber, green and blue are reserved for priority. */
:root{
  --bg:#EDF2F9; --surface:#FFFFFF; --ink:#12223D; --muted:#4F5F7A; --line:#C9D4E6; --soft:#E3EAF5;
  --brand:#1B4A8C; --brand2:#143A71; --brand-ink:#FFFFFF; --brand-sub:#C9DCF6; --goldbar:#E3B93C;
  --navy:#1B4A8C; --navy-ink:#FFFFFF; --gold:#9A6F00; --input:#FFFBD6; --input-line:#E2D58A;
  --p1:#C0392B; --p1t:#FBE4E1; --p1i:#FFFFFF;
  --p2:#F2B300; --p2t:#FFF2CC; --p2i:#1A1A1A;
  --p3:#2E9E5B; --p3t:#E1F2E7; --p3i:#FFFFFF;
  --p4:#2E75B6; --p4t:#DCEBF8; --p4i:#FFFFFF;
  --bad:#9C0006; --badt:#F8CBAD; --good:#006100; --goodt:#C6EFCE;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#142038; --ink:#E7EBF5; --muted:#9AA6C2; --line:#2A3558; --soft:#1D2848;
  --brand:#12305E; --brand2:#0D2447; --brand-ink:#FFFFFF; --brand-sub:#A9C2E8; --goldbar:#E3B93C;
  --navy:#24508F; --navy-ink:#FFFFFF; --gold:#E0B84A; --input:#2A2A14; --input-line:#5E5520;
  --p1t:#3A1D22; --p2t:#3A3114; --p3t:#173325; --p4t:#16304A;
  --bad:#FFB4AB; --badt:#4A2020; --good:#9FE3B3; --goodt:#16382A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#142038; --ink:#E7EBF5; --muted:#9AA6C2; --line:#2A3558; --soft:#1D2848;
  --brand:#12305E; --brand2:#0D2447; --brand-ink:#FFFFFF; --brand-sub:#A9C2E8; --goldbar:#E3B93C;
  --navy:#24508F; --navy-ink:#FFFFFF; --gold:#E0B84A; --input:#2A2A14; --input-line:#5E5520;
  --p1t:#3A1D22; --p2t:#3A3114; --p3t:#173325; --p4t:#16304A;
  --bad:#FFB4AB; --badt:#4A2020; --good:#9FE3B3; --goodt:#16382A; color-scheme:dark}
*{box-sizing:border-box}
.ar,.ari,.arm{letter-spacing:0;text-transform:none}
.ar{display:block;direction:rtl;text-align:right;font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,system-ui,serif;font-weight:400;font-style:normal;color:var(--muted);font-size:1.02em;line-height:1.75;margin-top:1px}
.ari{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,system-ui,serif;font-weight:400;font-style:normal;color:var(--muted);unicode-bidi:isolate}
.sep{color:var(--muted);opacity:.7} th .sep,.idchip .sep,.idc .sep{color:inherit}
td.c .ar,th .ar,.kpi .ar{text-align:center} th .ar,th .ari,.idchip .ari,.chip.ari,.chip[aria-pressed="true"] .ari,.idc .ari,.key .ari,.rate .ari{color:inherit;opacity:.9}
.arm{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,system-ui,serif;direction:rtl}
.meta i{font-style:normal;color:var(--muted)}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}
.cellb{font:600 12px var(--body);background:none;border:0;color:inherit;cursor:pointer;padding:8px 6px;width:100%}
td.cellbtn{padding:0}
.tintdone{background:var(--soft);color:var(--muted)}
.tint1.cellbtn{background:var(--p1);color:var(--p1i)} .tint2.cellbtn{background:var(--p2);color:var(--p2i)} .tint3.cellbtn{background:var(--p3);color:var(--p3i)} .tint4.cellbtn{background:var(--p4);color:var(--p4i)}
tr.grp td{background:var(--soft);font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
tr.e1 td:first-child{border-left:4px solid var(--p4)} tr.e2 td:first-child{border-left:4px solid var(--p3)} tr.e3 td:first-child{border-left:4px solid var(--p2)} tr.e4 td:first-child{border-left:4px solid #D9772B} tr.e5 td:first-child{border-left:4px solid var(--p1)}
.langsel{font-weight:600}
.list .muted>span+span{margin-inline-start:.5em}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--brand),var(--brand2));color:var(--brand-ink);padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;border-bottom:4px solid var(--goldbar);border-radius:0 0 12px 12px;box-shadow:0 3px 10px rgba(10,30,70,.25)}
.brandrow{display:flex;gap:14px;align-items:center;min-width:0}
img.logo{width:58px;height:58px;border-radius:50%;flex:none;background:#fff;border:2px solid var(--goldbar);box-shadow:0 1px 4px rgba(0,0,0,.3)}
h1{font:700 22px/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--brand-sub);font-size:12px;margin-top:2px}
header.top .ar,header.top .ari{color:var(--brand-sub)} header.top .ar{text-align:left} header.top .sep{color:var(--brand-sub)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{font:500 12px var(--mono);padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--goodt);color:var(--good)} .pill.bad{background:var(--badt);color:var(--bad)}
label.day,label.lang{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--brand-ink);font-weight:500}
header.top .pill{background:rgba(255,255,255,.16);color:var(--brand-ink);border:1px solid rgba(255,255,255,.35)}
header.top .pill.ok{background:#CDEFD8;color:#0B4A22;border-color:#CDEFD8} header.top .pill.bad{background:#FADBD8;color:#7B1010;border-color:#FADBD8}
header.top input,header.top select{background:#fff;color:#12223D;border:2px solid #fff;min-height:36px}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:14px 10px;margin-bottom:12px;scrollbar-width:thin}
nav.tabs button{font:600 14px var(--body);background:var(--surface);border:2px solid var(--brand);color:var(--brand);padding:9px 16px;min-height:42px;cursor:pointer;border-radius:10px;white-space:nowrap;box-shadow:0 1px 2px rgba(20,50,100,.15)}
nav.tabs button .ari{color:inherit;opacity:.85}
nav.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);box-shadow:0 3px 0 var(--goldbar)}
nav.tabs button:hover{background:var(--soft)} nav.tabs button[aria-selected="true"]:hover{background:var(--brand2)}
:root[data-theme="dark"] nav.tabs button{border-color:#5C86C6;color:#DCE8FA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button{border-color:#5C86C6;color:#DCE8FA}}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"],:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#fff}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2{font:700 17px/1.2 var(--display);margin:0 0 10px}
h3{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
p{margin:0 0 10px;max-width:70ch} .muted{color:var(--muted)}
details.ref{margin:0 0 18px} details.ref>summary{cursor:pointer;margin-bottom:8px}
.banner{background:var(--badt);color:var(--bad);padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:13px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi b{display:block;font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.bars{display:grid;gap:10px}
.bar .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar .track{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.fill.p1{background:var(--p1)}.fill.p2{background:var(--p2)}.fill.p3{background:var(--p3)}.fill.p4{background:var(--p4)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.list li:first-child{border-top:0}
.idchip{font:500 12px var(--mono);padding:2px 7px;border-radius:4px;white-space:nowrap;align-self:start}
.idchip.p1{background:var(--p1);color:var(--p1i)}.idchip.p2{background:var(--p2);color:var(--p2i)}.idchip.p3{background:var(--p3);color:var(--p3i)}.idchip.p4{background:var(--p4);color:var(--p4i)}
.tint1{background:var(--p1t)}.tint2{background:var(--p2t)}.tint3{background:var(--p3t)}.tint4{background:var(--p4t)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.chip{font:600 13px var(--body);border:2px solid var(--brand);background:var(--surface);color:var(--brand);padding:6px 14px;min-height:36px;border-radius:99px;cursor:pointer}
.chip:hover{background:var(--soft)}
:root[data-theme="dark"] .chip:not([aria-pressed="true"]){border-color:#5C86C6;color:#DCE8FA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip:not([aria-pressed="true"]){border-color:#5C86C6;color:#DCE8FA}}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
input,select,textarea{font:13px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
input.in,select.in,textarea.in{background:var(--input);border-color:var(--input-line)}
input[type=number]{width:5.2rem;text-align:center;font-variant-numeric:tabular-nums}
textarea{width:100%;resize:vertical;min-height:34px}
.act{display:grid;grid-template-columns:76px minmax(0,1fr) minmax(230px,300px);gap:12px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:8px}
.act .idc{font:600 13px var(--mono);padding:8px 4px;border-radius:5px;text-align:center;align-self:start}
.act .idc.p1{background:var(--p1);color:var(--p1i)}.act .idc.p2{background:var(--p2);color:var(--p2i)}.act .idc.p3{background:var(--p3);color:var(--p3i)}.act .idc.p4{background:var(--p4);color:var(--p4i)}
.act.tint1{background:var(--p1t)}.act.tint2{background:var(--p2t)}.act.tint3{background:var(--p3t)}.act.tint4{background:var(--p4t)}
.act.done{opacity:.62}.act.done .txt{text-decoration:line-through;text-decoration-color:var(--muted)}
.act .txt{margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.late{font:600 11px var(--mono);color:var(--bad);background:var(--badt);padding:1px 6px;border-radius:4px}
.ctl{display:grid;gap:6px}.ctl .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--navy);color:var(--navy-ink);font:600 12px var(--body);padding:8px 10px;text-align:center;position:sticky;top:0}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
td.c{text-align:center;font-variant-numeric:tabular-nums} td.l{text-align:left}
th.l{text-align:left}
tr.total td{background:var(--soft);font-weight:600}
td.rate{font:600 12px var(--mono);text-align:center}
.rate.RED{background:var(--p1);color:var(--p1i)}.rate.AMBER{background:var(--p2);color:var(--p2i)}.rate.GREEN{background:var(--p3);color:var(--p3i)}
td.bad{background:var(--badt);color:var(--bad);font-weight:600}td.good{background:var(--goodt);color:var(--good)}
.sticky1 td:first-child,.sticky1 th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.sticky1 th:first-child{background:var(--navy)}
.count{font:12px var(--mono);color:var(--muted);margin-left:10px;font-weight:400}
.key{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.key span{font:600 12px var(--body);padding:5px 12px;border-radius:5px}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
@media (max-width:760px){.act{grid-template-columns:1fr}.act .idc{justify-self:start;padding:4px 10px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

: "LC", "label": "Location C (FS1, FS2, Y1)", "short": "Location C", "yrs": "FS1, FS2, Y1", "ids": ["FS1", "FS2", "Y1"]}, {"code": "LB", "label": "Location B (Y2 to Y5)", "short": "Location B", "yrs": "Y2 to Y5", "ids": ["Y2", "Y3", "Y4", "Y5"]}, {"code": "LA", "label": "Location A (Y6 to Y9)", "short": "Location A", "yrs": "Y6 to Y9", "ids": ["Y6", "Y7", "Y8", "Y9"]}, {"code": "IG", "label": "Location IGCSE (Y10 to Y12)", "short": "Location IGCSE", "yrs": "Y10 to Y12", "ids": ["Y10", "Y11", "Y12"]}], "roles": ["TP", "School principal", "Lead in Location A", "Lead in Location B", "Lead in Location C", "Lead in Location IGCSE", "Resource lead", "HR liaison", "NQT mentor", "Coordinator", "Subject leads", "Safeguarding lead", "Social workers", "Hall monitors", "SENCO", "Senior leader", "ENG subject lead", "MAT subject lead", "SCI subject lead", "ICT subject lead", "PE subject lead", "ART subject lead", "ARABIC subject lead", "ARABIC SOCIAL subject lead", "RELIGION subject lead"], "leads": ["Lead in Location C", "Lead in Location B", "Lead in Location A", "Lead in Location IGCSE"], "locs": [{"code": "LC", "label": "Location C (FS1, FS2, Y1)", "short": "Location C", "lead": "Lead in Location C"}, {"code": "LB", "label": "Location B (Y2 to Y5)", "short": "Location B", "lead": "Lead in Location B"}, {"code": "LA", "label": "Location A (Y6 to Y9)", "short": "Location A", "lead": "Lead in Location A"}, {"code": "IG", "label": "Location IGCSE (Y10 to Y12)", "short": "Location IGCSE", "lead": "Lead in Location IGCSE"}], "beh": [{"id": "BR1", "sec": "In the lesson", "title": "Steps 1 to 3 before anything is recorded", "text": "1 Reminder of the expectation. 2 Warning that states the consequence. 3 Private reset chat. Only if the behaviour continues is an incident recorded on the card.", "who": "Subject teacher", "e": 0}, {"id": "BR2", "sec": "In the lesson", "title": "A lesson counts once", "text": "A lesson counts once, however many warnings the pupil gets in it. The daily count is the number of lessons with an incident, out of 7.", "who": "Subject teacher", "e": 0}, {"id": "BR3", "sec": "In the lesson", "title": "Removal from the lesson", "text": "Remove a pupil only if the behaviour is serious (safety risk, abuse, serious defiance) or continues after steps 1 to 3. The hall monitor escorts the pupil to the Reflection Room. A removal counts as an incident.", "who": "Subject teacher, Hall monitors", "e": 0}, {"id": "BR4", "sec": "Daily count", "title": "1 lesson with an incident", "text": "The teacher resolves it. The social worker sees the log. No parent contact.", "who": "Subject teacher, Social workers", "e": 1}, {"id": "BR5", "sec": "Daily count", "title": "2 lessons with an incident", "text": "A daily report card starts or continues. The social worker talks to the pupil. The parent sees the card.", "who": "Social workers", "e": 2}, {"id": "BR6", "sec": "Daily count", "title": "3 lessons with an incident", "text": "On the card. Lunchtime check-in. The location lead is told. The social worker messages or calls the parent the same day.", "who": "Social workers, All location leads", "e": 3}, {"id": "BR7", "sec": "Daily count", "title": "4 to 5 lessons, or a second removal", "text": "Reflection Room for the rest of the day. The location lead is told (and SENCO if the pupil has SEN). The location lead phones the parent the same day.", "who": "All location leads, SENCO", "e": 4}, {"id": "BR8", "sec": "Daily count", "title": "6 to 7 lessons, or any serious incident", "text": "A senior leader (Deputy or Assistant Head), the SENCO and, if there is a welfare concern, the safeguarding lead take over. Phone the parent the same day and meet within 2 school days. Consider suspension under statutory guidance (local rule to be confirmed).", "who": "Senior leader, SENCO, Safeguarding lead", "e": 5}, {"id": "BR9", "sec": "Weekly and longer triggers", "title": "3 days in one school week with 3 or more incidents", "text": "The location lead and SENCO check for unmet need (assess, plan, do, review) and hold a parent meeting.", "who": "All location leads, SENCO", "e": 0}, {"id": "BR10", "sec": "Weekly and longer triggers", "title": "2 weeks on a daily card with no improvement", "text": "Senior leader meeting, a written behaviour plan, and consider outside support. A pupil on a card is reviewed at least every 10 school days, and good days are shared with parents too.", "who": "Senior leader", "e": 0}, {"id": "BR11", "sec": "Reflection Room", "title": "Allocated room and staffing", "text": "Room: [name and number to be filled in]. Staffed in every lesson by [named staff or rota to be filled in]. A hall monitor escorts the pupil and logs arrival and departure.", "who": "Senior leader, Hall monitors", "e": 0}, {"id": "BR12", "sec": "Reflection Room", "title": "Education continues", "text": "The subject teacher sends work and the pupil is supervised while doing it. Each placement ends with a short reintegration chat and a return-to-class plan. A pupil with SEN or a mental health need: consider a calm space with a trusted adult first, and tell the SENCO the same day.", "who": "Subject teacher, SENCO", "e": 0}, {"id": "BR13", "sec": "Card handover", "title": "Teachers move, pupils stay", "text": "Pupils stay in their classroom and teachers change over. The outgoing teacher completes the card before leaving and hands it straight to the incoming teacher. The card is never left in a room. If the next teacher has not arrived, the hall monitor holds it.", "who": "Subject teacher, Hall monitors", "e": 0}, {"id": "BR14", "sec": "Card handover", "title": "PE and practical ICT", "text": "Pupils move, so the card goes with them, escorted by a hall monitor. The specialist teacher hands it on. In the Reflection Room the card goes with the pupil.", "who": "Hall monitors", "e": 0}, {"id": "BR15", "sec": "Card handover", "title": "Lost card", "text": "A lost card is not an incident. The hall monitor tells the social worker and a replacement card is started and marked replacement. Earlier lessons are filled in from teacher notes.", "who": "Hall monitors, Social workers", "e": 0}, {"id": "BR16", "sec": "Card handover", "title": "End of the day", "text": "The social worker totals the card, initials it and logs the score. The parent signs it the next morning.", "who": "Social workers", "e": 0}, {"id": "BR17", "sec": "Terms and local rules", "title": "Role and room terms", "text": "Location lead, social worker, hall monitor, Reflection Room, SENCO, safeguarding lead and senior leader match the school's own terms, in English and Arabic.", "who": "School principal", "e": 0}, {"id": "BR18", "sec": "Terms and local rules", "title": "Local rules", "text": "Removal, suspension and parent contact follow Egyptian Ministry and Directorate rules. The proposal was written from UK guidance, so each rule needs checking (local rule to be confirmed).", "who": "School principal", "e": 0}, {"id": "BR19", "sec": "Terms and local rules", "title": "Seven lessons a day, and who the card is for", "text": "The count assumes 7 lessons a day, but the 2 October 2026 timetable poster shows 8 periods a day for Years 3 to 6 (some are activity periods). Confirm the real number and whether the card applies to FS1, FS2 and Years 1 to 3.", "who": "School principal", "e": 0}], "pat": [["^of (\\d+) actions done$", "من $1 إجراءً منجزة"], ["^of figures entered \\((\\d+) of (\\d+)\\)$", "من الأرقام أُدخلت ($1 من $2)"], ["^(\\S+) teachers short \\((\\S+) available, (\\S+) needed\\)$", "ينقص $1 معلماً ($2 متاح، $3 مطلوب)"], ["^(\\d+) done, (\\d+) in progress, (\\d+) blocked, of (\\d+) \\((\\d+)%\\)$", "$1 مكتمل، $2 قيد التنفيذ، $3 متعثّر، من $4 ($5%)"], ["^Open P1 actions \\((\\d+)\\)$", "إجراءات P1 المفتوحة ($1)"], ["^Past their due date \\((\\d+)\\)$", "تجاوزت موعدها ($1)"], ["^(\\d+) of (\\d+)$", "$1 من $2"], ["^(\\d+) of (\\d+) filled$", "$1 من $2 مُدخلة"], ["^\\| due (.+)$", "| الموعد <span dir=\"ltr\">$1</span>"], ["^\\((\\d{4}-\\d\\d-\\ > واملأ الخانات الصفراء: عدد الطلاب، والفصول، والحصص الأسبوعية، والمعلمين المتاحين والمطلوبين لكل مرحلة دراسية ومادة.", "Read <b>Analysis</b> to see where teachers are missing. It updates as soon as numbers are typed.": "اقرأ <b>التحليل</b> لمعرفة أين ينقص المعلمون. يتحدّث فور كتابة الأرقام.", "Work through <b>Actions</b> in colour order: red first, then amber, green and blue. Set each action's status as it moves.": "نفّذ <b>الإجراءات</b> بترتيب الألوان: الأحمر أولاً ثم البرتقالي والأخضر والأزرق. حدّث حالة كل إجراء عند تقدّمه.", "Check <b>Dashboard</b> at the daily huddle, and update <b>Risks</b> and <b>Scorecard</b> at the weekly review.": "راجع <b>لوحة المتابعة</b> في الاجتماع اليومي، وحدّث <b>المخاطر</b> و<b>بطاقة الأداء</b> في المراجعة الأسبوعية.", "Yellow boxes are for typing. Changes save automatically and everyone with edit access sees them within seconds. People who can only view see the figures but cannot change them.": "الخانات الصفراء للكتابة. تُحفظ التغييرات تلقائياً ويراها كل من لديه صلاحية التعديل خلال ثوانٍ. من يملك صلاحية العرض فقط يرى الأرقام ولا يستطيع تغييرها.", "Colour key": "دليل الألوان", "P1 red: critical": "P1 أحمر: حرج", "P2 amber: high": "P2 برتقالي: عالٍ", "P3 green: medium": "P3 أخضر: متوسط", "P4 blue: build": "P4 أزرق: بناء", "Priority framework": "إطار الأولويات", "Priority": "الأولوية", "Meaning": "المعنى", "Window": "الفترة", "Test for inclusion": "معيار الإدراج", "P1 Critical": "P1 حرج", "P2 High": "P2 عالٍ", "P3 Medium": "P3 متوسط", "P4 Build": "P4 بناء", "Child safety, lessons with no adult, pay risk that could end attendance": "سلامة الأطفال، وحصص بلا معلم أو مشرف، وخطر الرواتب الذي قد يوقف الحضور", "Keeps staff attending and protects learning in the core subjects": "يُبقي العاملين حاضرين ويحمي التعلّم في المواد الأساسية", "Builds teacher capacity, resources and outside support": "يبني قدرات المعلمين والموارد والدعم الخارجي", "Makes the gains last after the 30 days": "يجعل المكاسب تستمر بعد الثلاثين يوماً", "Days 1 to 7": "الأيام 1 إلى 7", "Days 1 to 14": "الأيام 1 إلى 14", "Days 8 to 30": "الأيام 8 إلى 30", "Days 31 to 90": "الأيام 31 إلى 90", "A harm or a collapse happens if this waits a week": "قد يقع ضرر أو انهيار إذا تأخّر هذا أسبوعاً", "Learning loss grows every week this waits": "يزداد فاقد التعلّم كل أسبوع يتأخر فيه هذا", "Needs P1 evidence or approvals first": "يحتاج أولاً إلى أدلة أو موافقات من P1", "Needs a stable base and a named owner": "يحتاج إلى أساس مستقر ومسؤول محدد بالاسم", "The four audit teams now run in parallel as four workstreams under the Troubleshooting Principal (TP). Pay, coverage, materials and resources depend on each other, so waiting for one team to finish delays the critical actions.": "تعمل فرق المراجعة الأربعة الآن بالتوازي كأربعة مسارات عمل تحت إشراف مدير الإصلاح واستكشاف المشكلات (TP). الرواتب وتغطية الحصص والمواد والموارد يعتمد بعضها على بعض، لذا فانتظار فريق واحد حتى ينتهي يؤخّر الإجراءات الحرجة.", "Workstreams": "مسارات العمل", "Code": "الرمز", "Workstream": "مسار العمل", "Lead role": "الدور القيادي", "Scope": "النطاق", "Staff and welfare": "العاملون ورعايتهم", "Learning continuity": "استمرارية التعلّم", "Teacher capacity": "قدرات المعلمين", "Resources and partnerships": "الموارد والشراكات", "Troubleshooting Principal and coordinator": "مدير الإصلاح واستكشاف المشكلات والمنسّق", "Academic lead": "مسؤول الشؤون الأكاديمية", "Subject leads with an NQT mentor": "رؤساء المواد مع مرشد للمعلمين الجدد", "Resource lead and partnerships lead": "مسؤول الموارد ومسؤول الشراكات", "HR liaison": "منسّق الموارد البشرية", "Attendance, contracts and pay escalation, practical barriers, safeguarding of staff data": "الحضور، وتصعيد قضايا العقود والرواتب، والعوائق العملية، وحماية بيانات العاملين", "Coverage map, timetable triage, cover bank, continuity kits, learning checks": "خريطة التغطية، وترتيب أولويات الجدول، وبنك أنشطة التغطية، وحقائب الاستمرارية، وفحوص التعلّم", "NQT induction, subject knowledge, coaching": "تهيئة المعلمين الجدد، والمعرفة بالمادة، والتدريب", "Safety swe لا توجد قاعات لم تُراجَع", "Supervision protocol: no class is ever left without a named adult. Publish a daily supervisor rota using free-period staff, admin staff and leaders": "بروتوكول الإشراف: لا يُترك أي فصل دون شخص بالغ محدد بالاسم. نشر جدول إشراف يومي من المعلمين في حصص الفراغ والإداريين والقيادات", "Rota posted; unsupervised periods logged daily": "نشر الجدول؛ وتسجيل الحصص بلا إشراف يومياً", "Start the daily attendance and coverage board: absent teachers, uncovered periods, named cover. This also gives the attendance baseline": "بدء لوحة الحضور والتغطية اليومية: المعلمون الغائبون، والحصص غير المغطّاة، والبديل المحدد بالاسم. وهي تعطي أيضاً خط الأساس للحضور", "Board photographed or copied each day": "تصوير اللوحة أو نسخها كل يوم", "Build the coverage map: subject x class x periods needed, available, gap. Work out coverage % (see DATA Analysis)": "إعداد خريطة التغطية: المادة × الفصل × الحصص المطلوبة والمتاحة والفجوة. حساب نسبة التغطية (انظر تحليل البيانات)", "Map and % per subject": "الخريطة والنسبة لكل مادة", "Capture staff concerns through one confidential route. Separate contract and pay issues from practical barriers (travel, food). Record only counts in the general tracker": "جمع شواغل العاملين عبر قناة سرية واحدة. الفصل بين قضايا العقود والرواتب والعوائق العملية (المواصلات، الطعام). تسجيل الأعداد فقط في المتتبّع العام", "Restricted log started; counts only in tracker": "بدء سجل مقيّد؛ والأعداد فقط في المتتبّع", "Publish a one-page Triage Order: which lessons are protected first (exam-critical years, then MAT, ENG, SCI, Arabic) once exam years are confirmed": "نشر ورقة واحدة لترتيب الأولويات: أي الحصص تُحمى أولاً (سنوات الامتحانات الحاسمة، ثم الرياضيات والإنجليزية والعلوم والعربية) بعد تأكيد سنوات الامتحانات", "Triage Order approved by the school principal": "اعتماد ترتيب الأولويات من مدير المدرسة", "Send the pay and coverage evidence pack to the Directorate and ask in writing for a date for contract signing and first payment": "إرسال ملف أدلة الرواتب والتغطية إلى المديرية التعليمية وطلب موعد كتابي لتوقيع العقود وأول صرف", "Sent copy, date, reference number": "نسخة مرسلة، وتاريخ، ورقم مرجعي", "Confirm in writing who legally receives donated goods and how they are registered, before any outreach starts": "التأكيد كتابةً على الجهة التي تستلم السلع المتبرَّع بها قانونياً وكيفية تسجيلها، قبل بدء أي تواصل خارجي", "Written receiving route": "مسار استلام مكتوب", "Core continuity kits v1 for MAT, ENG and SCI, starting with the two year groups with most uncovered periods. Kit = one-page lesson plan, student sheet, answer key, 3-question exit check, Arabic/English key words. Reuse existing books and approved open resources first": "الإصدار 1 من حقائب الاستمرارية الأساسية للرياضيات والإنجليزية والعلوم، بدءاً بالمرحلتين الأكثر حصصاً غير مغطّاة. الحقيبة = خطة درس من صفحة واحدة، وورقة للطالب، ومفتاح إجابات، واختبار خروج من 3 أسئلة، ومفردات رئيسية عربي/إنجليزي. أعد استخدام الكتب القائمة والموارد المفتوحة المعتمدة أولاً", "Two weeks of lessons per subject; review form signed; tested in one class": "دروس أسبوعين لكل مادة؛ نموذج مراجعة موقّع؛ وتجربة في فصل واحد", "Timetable triage: specialists teach exam and core classes in fewer, longer blocks; kits and supervisors cover the rest. Needs approval because it changes curriculum hours": "ترتيب أولويات الجدول: يدرّس المتخصصون فصول الامتحانات والمواد الأساسية في كتل أقل وأطول؛ وتغطي الحقائب والمشرفون الباقي. يحتاج موافقة لأنه يغيّر ساعات المنهج", "Draft timetable; written approval or refusal": "جدول مقترح؛ وموافقة أو رفض مكتوب", "Cover bank: ready-to-run activities for one lesson length, for EYFS, primary and secondary, each with year, time, materials, instructions, answer guide and storage place": "بنك أنشطة التغطية: أنشطة جاهزة للتنفيذ بطول حصة واحدة لمرحلة رياض الأطفال والابتدائية والثانوية، لكل نشاط السنة والوقت والمواد والتعليمات ودليل الإجابات ومكان الحفظ", "Bank in the resource room; one per priority gap": "البنك في غرفة الموارد؛ نشاط لكل فجوة ذات أولوية", "NQT starter kit and default buddy: every NQT has a named buddy by Day 3 (opt-out, not opt-in) and the kit by Day 7. Weekly 20-minute clinic": "حقيبة بداية للمعلم الجديد وزميل مرافق افتراضي: لكل معلم جديد زميل مرافق محدد بالاسم بحلول اليوم 3 (الأصل المشاركة والاستثناء بطلب منه) والحقيبة بحلول اليوم 7. عيادة أسبوعية مدتها 20 دقيقة", "Buddy list; kit issued; clinic dates": "قائمة الزملاء؛ وتسليم الحقائب؛ ومواعيد العيادة", "Survey practical barriers to attendance (travel, meals). Cost per teacher per month = attendance days x daily travel cost. Present options to the school principal and Directorate": "مسح العوائق العملية أمام الحضور (المواصلات، الوجبات). التكلفة لكل معلم شهرياً = أيام الحضور × تكلفة المواصلات اليومية. عرض الخيارات على مدير المدرسة والمديرية", "Counts and cost range, no names": "الأعداد ونطاق التكلفة دون أسماء", "Approved in-kind support for attendance: a staffroom meal, shared transport or donated fuel, on the same rule for all staff, through the confirmed receiving route. No cash": "دعم عيني معتمد للحضور: وجبة في غرفة المعلمين أو مواصلات مشتركة أو وقود متبرَّع به، بقاعدة واحدة لجميع العاملين، عبر مسار الاستلام المؤكَّد. لا نقد", "Written approval and donation checklist done": "موافقة مكتوبة واستيفاء قائمة فحص التبرعات", "Retention touchpoints: weekly 10-minute check-in with each workstream lead; named recognition and training certificates (a retention idea, not an evidenced fix)": "نقاط تواصل للاحتفاظ بالعاملين: لقاء أسبوعي من 10 دقائق مع كل مسؤول مسار؛ وتقدير باسم الشخص وشهادات تدريب (فكرة للاحتفاظ بالعاملين وليست حلاً مثبتاً بالأدلة)", "Check-in log": "سجل اللقاءات", "Resource inventory baseline: books, guides, stationery, science and ICT kit, furniture. Mark each usable, missing, damaged, repairable or unsafe. Core subjects and ICT first": "جرد الموارد الأساسي: الكتب والأدلة والقرطاسية وأدوات العلوم وتكنولوجيا المعلومات والأثاث. تصنيف كل عنصر: صالح، أو مفقود، أو تالف، أو قابل للإصلاح، أو غير آمن. المواد الأساسية وتكنولوجيا المعلومات أولاً", "Inventory sheet; priority gaps list": "ورقة الجرد؛ وقائمة الفجوات ذات الأولوية", "Resource room and sign-out: item IDs, register, named custodian, laminated class sets (one set of 30 replaces 180 copies)": "غرفة الموارد وتسجيل الاستعارة: أرقام تعريف للعناصر، وسجل، وأمين عهدة محدد بالاسم، ومجموعات فصلية مغلّفة (مجموعة واحدة من 30 تغني عن 180 نسخة)", "Register in use; custodian signed": "السجل قيد الاستخدام؛ وتوقيع أمين العهدة", "Classroom reliability plan: list rooms with facilities that do not work reliably and rooms with none. Run screen-based lessons only in reliable rooms and print copies for the rest": "خطة موثوقية الفصول: حصر الفصول التي لا تعمل تجهيزاتها بشكل موثوق والتي لا تجهيزات فيها. تقديم الدروس المعتمدة على الشاشات في الفصول الموثوقة فقط وطباعة نسخ للبقية", "Room list; rota": "قائمة الفصول؛ والجدول", "Funding paper trail: ask in writing for the school's entitlement, what it may order and what fees go where. Log every request with date, item, cost and reply. State facts only; make no accusations": "توثيق التمويل: الطلب كتابةً لمعرفة مخصصات المدرسة وما يحق لها طلبه وأين تذهب الرسوم. تسجيل كل طلب بتاريخه وبنده وتكلفته والرد عليه. ذكر الوقائع فقط ودون اتهامات", "Written request and reply log": "الطلب المكتوب وسجل الردود", "Local outreach first: Directorate, local universities and teacher-training providers, then local suppliers. Official routes only, after school approval": "التواصل المحلي أولاً: المديرية، والجامعات المحلية وجهات تدريب المعلمين، ثم الموردون المحليون. عبر القنوات الرسمية فقط وبعد موافقة المدرسة", "Contact log entries, including no-replies": "تسجيلات سجل التواصل، بما فيها الجهات التي لم ترد", "Scale the tested kits to the next year groups in coverage-map order. Use approved open resources where licences allow and always keep a printed version": "تعميم الحقائب المُجرَّبة على المراحل التالية بحسب ترتيب خريطة التغطية. استخدام الموارد المفتوحة المعتمدة حيث تسمح التراخيص مع الاحتفاظ دائماً بنسخة مطبوعة", "Kits per subject and year group; each reviewed": "الحقائب لكل مادة ومرحلة؛ وكل منها مُراجَعة", "Subject knowledge and teacher English support: one-page teacher briefing per unit, model teacher language cards, Arabic/English glossary, short audio of model explanations, weekly 30-minute subject huddle. Low-stakes and developmental": "دعم المعرفة بالمادة ولغة المعلم الإنجليزية: إحاطة من صفحة واحدة للمعلم لكل وحدة، وبطاقات عبارات نموذجية للمعلم، ومسرد عربي/إنجليزي، وتسجيلات صوتية قصيرة لشروح نموذجية، ولقاء أسبوعي للمادة مدته 30 دقيقة. غير تقييمي وتطويري", "Briefings issued; huddle log": "تسليم الإحاطات؛ وسجل اللقاءات", "Peer coaching: voluntary pairs of experienced teachers, one observable goal each, short follow-up date. Notes are developmental, not punitive": "التدريب بين الأقران: أزواج تطوعية من المعلمين ذوي الخبرة، لكل زوج هدف واحد قابل للملاحظة وموعد متابعة قصير. الملاحظات تطويرية وليست عقابية", "Pairs agreed; coaching record": "الاتفاق على الأزواج؛ وسجل التدريب", "Repair and maintenance triage: separate safe repairs from specialist jobs. Ask local trades or technical schools through official routes, with approval": "ترتيب أولويات الإصلاح والصيانة: الفصل بين الإصلاحات الآمنة والأعمال المتخصصة. طلب مساعدة الحرفيين المحليين أو المدارس الفنية عبر القنوات الرسمية وبموافقة", "Repair log updated; cost and approval status": "تحديث سجل الإصلاح؛ والتكلفة وحالة الموافقة", "Partnership proposals (maximum three) for specific items with quantities, condition, delivery, storage, maintenance and custodian. Local first; then Akelius Foundation, UNICEF Egypt, Egyptian Red Crescent, TotalEnergies Egypt, one enquiry each, after approval": "مقترحات شراكة (ثلاثة كحد أقصى) لبنود محددة مع الكميات والحالة والتسليم والتخزين والصيانة وأمين العهدة. المحلي أولاً؛ ثم مؤسسة أكيليوس، واليونيسف مصر، والهلال الأحمر المصري، وتوتال إنرجيز مصر، باستفسار واحد لكل جهة وبعد الموافقة", "Contact log; follow-up dates": "سجل التواصل؛ ومواعيد المتابعة", "Apply the donation approval checklist to every offer. Pause any offer if approval, receiving body, ownership or maintenance is unclear": "تطبيق قائمة فحص الموافقة على كل عرض تبرع. إيقاف أي عرض إذا لم تكن الموافقة أو جهة الاستلام أو الملكية أو الصيانة واضحة", "Checklist signed per offer": "قائمة الفحص موقّعة لكل عرض", "Second written escalation to the Directorate if no written date has come. Use the school's established chain of command": "تصعيد كتابي ثانٍ إلى المديرية إذا لم يصل موعد مكتوب. استخدام التسلسل الإداري المعتمد في المدرسة", "Dated letters and reference numbers": "خطابات مؤرخة وأرقام مرجعية", "Learning check: an anonymised sample of exit questions from the pilot classes. Record what was understood and what to change": "فحص التعلّم: عيّنة مجهولة الهوية من أسئلة الخروج من الفصول التجريبية. تسجيل ما فُهم وما يلزم تغييره", "Sample reviewed; one change per kit": "مراجعة العيّنة؛ وتعديل واحد لكل حقيبة", "Midpoint review: move or drop actions that are not working": "مراجعة منتصف المدة: نقل الإجراءات التي لا تنجح أو إسقاطها", "Review notes": "ملاحظات المراجعة", "Risk review: update the risk register. Pending donations are never counted as secured": "مراجعة المخاطر: تحديث سجل المخاطر. لا تُحتسب التبرعات المعلّقة على أنها مؤمَّنة أبداً", "Updated register": "سجل محدَّث", "Day 30 review: what changed, what did not, why, with evidence. Close done items, carry forward the rest, agree no more than three priorities for next month": "مراجعة اليوم 30: ما الذي تغيّر وما الذي لم يتغيّر ولماذا، مع الأدلة. إغلاق البنود المنجزة وترحيل الباقي والاتفاق على ثلاث أولويات على الأكثر للشهر القادم", "Review signed": "مراجعة موقّعة", "Kits for the remaining subjects: Arabic, Arabic Social and Religion (aligned to the Ministry textbooks), then PE, Art and ICT": "حقائب للمواد المتبقية: العربية والدراسات الاجتماعية والتربية الدينية (متوافقة مع كتب الوزارة)، ثم التربية البدنية والفنون وتكنولوجيا المعلومات", "One tested kit per subject": "حقيبة مُجرَّبة واحدة لكل مادة", "Revise one scheme of work at a time, weakest subject first. Do not create a document staff cannot maintain": "مراجعة خطة عمل دراسية واحدة في كل مرة طة التغطية، مع تغطية محددة بالاسم لكل فجوة", "RELIGION in Location IGCSE: build one continuity kit for Y10 to Y12 (one-page lesson plan, student sheet, answer key, 3-question exit check, Arabic/English key words) and test it in one class before wider use. Align it to the Ministry textbook.": "التربية الدينية في موقع IGCSE: إعداد حقيبة استمرارية واحدة (السنوات 10 إلى 12) تضم خطة درس من صفحة واحدة وورقة للطالب ومفتاح إجابات واختبار خروج من 3 أسئلة ومفردات رئيسية عربي/إنجليزي، وتجربتها في فصل واحد قبل التوسع. مع مواءمتها لكتاب الوزارة.", "RELIGION in Location IGCSE: learning check. Take an anonymised sample of exit questions from Y10 to Y12, record what was understood and what to change, and revise the kit.": "التربية الدينية في موقع IGCSE: فحص التعلّم. أخذ عيّنة مجهولة الهوية من أسئلة الخروج في السنوات 10 إلى 12، وتسجيل ما فُهم وما يلزم تغييره، وتعديل الحقيبة.", "All year groups": "كل المراحل الدراسية", "All subjects": "كل المواد", "Whole school": "المدرسة كلها", "Review the proposed behaviour and pastoral programme on the Behaviour tab. The school principal marks every item approved, approved with changes, or needs a decision, and checks in writing which rules on removal from class, suspension and parent contact must follow Ministry or Directorate rules (local rule to be confirmed).": "مراجعة برنامج السلوك والرعاية الطلابية المقترح في تبويب السلوك. يضع مدير المدرسة على كل بند: معتمد، أو معتمد مع تعديلات، أو يحتاج قراراً، ويتحقق كتابةً من القواعد التي يجب أن تتبع قواعد الوزارة أو المديرية في الإخراج من الفصل والإيقاف والتواصل مع أولياء الأمور (القاعدة المحلية تحتاج تأكيدًا).", "Every item on the Behaviour tab marked; local rules checked in writing": "وضع علامة على كل بند في تبويب السلوك، والتحقق الكتابي من القواعد المحلية", "Name the safeguarding lead and publish the route for a welfare concern: who a teacher tells, and when (the same day). A child who may be at risk is never handled through the behaviour card alone.": "تسمية مسؤول حماية الطفل ونشر مسار التبليغ عن أي قلق على سلامة الطفل: لمن يبلّغ المعلم، ومتى (في اليوم نفسه). لا يُعالَج الطفل المعرَّض للخطر عبر بطاقة السلوك وحدها.", "Named lead; route posted in every staffroom": "تسمية المسؤول، ونشر المسار في كل غرفة معلمين", "Name the people the programme needs: a social worker for each class group, a lead for each location (A, B, C and IGCSE), a SENCO, a senior leader (Deputy or Assistant Head) and hall monitors. Check that each English and Arabic job term matches the school's own. Record names on the Roles tab.": "تسمية من يحتاجهم البرنامج: أخصائي اجتماعي لكل مجموعة فصول، ومسؤول لكل موقع (A وB وC وIGCSE)، ومنسّق احتياجات خاصة، وقيادي من الإدارة العليا (نائب أو مساعد المدير)، ومراقبو ممرات. التأكد من أن كل مسمى بالإنجليزية والعربية يطابق مسميات المدرسة. تُسجَّل الأسماء في تبويب الأدوار.", "Role list complete on the Roles tab; terms agreed in English and Arabic": "اكتمال قائمة الأدوار في تبويب الأدوار، والاتفاق على المسميات بالإنجليزية والعربية", "Reflection Room safety rule: no pupil is sent to the Reflection Room until the room is allocated, a named adult is present in every lesson, and the arrival and departure log is ready. Until then, a removed pupil is supervised by a senior leader.": "قاعدة السلامة لغرفة التأمل: لا يُرسَل أي طالب إلى غرفة التأمل قبل تخصيص الغرفة ووجود شخص بالغ محدد بالاسم في كل حصة وجاهزية سجل الوصول والمغادرة. وإلى ذلك الحين يشرف قيادي من الإدارة العليا على الطالب المُخرَج.", "Room stays closed until a named-staff rota is posted": "تبقى الغرفة مغلقة حتى نشر جدول بالعاملين المسمّين", "Print the daily report cards, four to an A4 sheet, in English and Arabic. Give each social worker a pack and keep a spare pack in the resource room.": "طباعة بطاقات التقرير اليومية، أربع بطاقات في كل ورقة A4، بالإنجليزية والعربية. تسليم كل أخصائي اجتماعي رزمة واحتفاظ غرفة الموارد برزمة احتياطية.", "Printed cards in each social worker's room": "بطاقات مطبوعة في غرفة كل أخصائي اجتماعي", "Brief all teachers for 15 minutes: the 7-lesson daily count, steps 1 to 3 (reminder, warning, private reset chat), when to record an incident and when to remove a pupil. A lesson counts once, however many warnings the pupil gets in it.": "إحاطة جميع المعلمين لمدة 15 دقيقة: العدّ اليومي لسبع حصص، والخطوات من 1 إلى 3 (تذكير، وتحذير، وحديث خاص لإعادة الضبط)، ومتى يُسجَّل الحادث ومتى يُخرَج الطالب. تُحتسَب الحصة مرة واحدة مهما تعددت التحذيرات فيها.", "Attendance note; every teacher briefed": "مذكرة حضور، وإحاطة كل معلم", "Hall monitor rota: name a monitor for each corridor at every changeover and give each a list of pupils on cards. Monitors check that every pupil on a card has it with them.": "جدول مراقبي الممرات: تسمية مراقب لكل ممر عند كل تبديل حصص، وتزويده بقائمة الطلاب الحاملين للبطاقات. يتأكد المراقبون من أن كل طالب لديه بطاقة معه.", "Rota posted; monitors briefed": "نشر الجدول، وإحاطة المراقبين", "Card handover practice: pupils stay in their classroom and teachers change over. The outgoing teacher completes the card, hands it straight to the incoming teacher and never leaves it in a room. If the next teacher has not arrived, the hall monitor holds it. PE and practical ICT: a hall monitor escorts the pupil and the specialist teacher hands the card on.": "التدرّب على تسليم البطاقة: يبقى الطلاب في فصلهم ويتبدّل المعلمون. يكمل المعلم المغادر البطاقة ويسلّمها مباشرةً للمعلم القادم ولا يتركها في الفصل أبداً. وإذا لم يصل المعلم التالي يحتفظ بها مراقب الممرات. التربية البدنية وتكنولوجيا المعلومات العملية: يرافق مراقب الممرات الطالب ويسلّم المعلم المتخصص البطاقة لمن بعده.", "Handover walk-through done; any card found in a room is logged": "إجراء تجربة التسليم، وتسجيل أي بطاقة وُجدت في فصل", "Set up the Reflection Room: allocated room, staffing rota, hall monitor escort with an arrival and departure log, work sent by the subject teacher, and a short reintegration chat and return-to-class plan for every placement.": "تجهيز غرفة التأمل: غرفة مخصصة، وجدول للعاملين، ومرافقة من مراقب الممرات مع سجل للوصول والمغادرة، وأعمال يرسلها معلم المادة، وحديث قصير لإعادة الدمج وخطة للعودة إلى الفصل لكل حالة.", "Room, rota and log in use": "الغرفة والجدول والسجل قيد الاستخدام", "Parent contact routes and scripts in Arabic and English: the social worker messages or calls the same day a pupil reaches 3 lessons, the location lead phones at 4 to 5, and the parent signs the card the next morning. Share good days as well as problems.": "مسارات ونصوص التواصل مع أولياء الأمور بالعربية والإنجليزية: يراسل الأخصائي الاجتماعي أو يتصل في اليوم نفسه حين يبلغ الطالب 3 حصص، ويتصل مسؤول الموقع عند 4 إلى 5، ويوقّع ولي الأمر البطاقة صباح اليوم التالي. مشاركة الأيام الجيدة أيضاً وليس المشكلات فقط.", "Scripts approved; contact log started (counts only in this tracker)": "اعتماد النصوص، وبدء سجل التواصل (الأعداد فقط في هذا المتتبّع)", "A native Arabic speaker reviews every Arabic line on the cards, the flowchart and this tracker, including the terms for location lead, social worker, hall monitor, Reflection Room, SENCO and safeguarding lead.": "يراجع متحدث أصلي للعربية كل سطر عربي في البطاقات ومخطط التدفق وهذا المتتبّع، بما في ذلك مسميات مسؤول الموقع والأخصائي الاجتماعي ومراقب الممرات وغرفة التأمل ومنسّق الاحتياجات الخاصة ومسؤول حماية الطفل.", "Reviewer's changes applied": "تطبيق تعديلات المراجع", "SEN and mental health route: a pupil with SEN or a mental health need is considered for a calm space with a trusted adult first, and the SENCO is told the same day. Write the route and a one-page referral form.": "مسار الاحتياجات الخاصة والصحة النفسية: يُنظَر أولاً في توفير مكان هادئ مع شخص بالغ موثوق للطالب ذي الاحتياجات الخاصة أو الحاجة النفسية، ويُبلَّغ منسّق الاحتياجات الخاصة في اليوم نفسه. كتابة المسار ونموذج إحالة من صفحة واحدة.", "Route published; form in use": "نشر المسار، واستخدام النموذج", "Set up one behaviour log: date, lesson number, step reached and outcome for each incident. Only staff who need it can see it. This tracker holds counts only, never names.": "إنشاء سجل واحد للسلوك: التاريخ ورقم الحصة والخطوة التي وصل إليها الموقف والنتيجة لكل حادث. لا يطّلع عليه إلا من يحتاجه. يحتفظ هذا المتتبّع بالأعداد فقط ولا يحتوي أسماء.", "Log in use; access list agreed": "السجل قيد الاستخدام، والاتفاق على قائمة من يحق لهم الاطلاع", "Decide whether the daily card applies to EYFS (FS1 to FS2). Suggestion for review: no card; use play-based support, talk to parents directly and tell the social worker of any concern.": "اتخاذ قرار بشأن انطباق البطاقة اليومية على المرحلة التأسيسية (FS1 إلى FS2). اقتراح للمراجعة: لا بطاقة، بل دعم قائم على اللعب وحديث مباشر مع أولياء الأمور وإبلاغ الأخصائي الاجتماعي بأي قلق.", "Written decision for EYFS": "قرار مكتوب بشأن المرحلة التأسيسية", "Confirm the social worker for each class group in FS1, FS2, Y1, who holds the cards and where they are kept. The lead in Location C is responsible for this location.": "تأكيد الأخصائي الاجتماعي لكل مجموعة فصول في FS1 وFS2 والسنة 1، ومن يحتفظ بالبطاقات وأين تُحفَظ. ويتولى مسؤول الموقع C المسؤولية عن هذا الموقع.", "Names recorded for FS1, FS2, Y1; card storage place agreed": "تسجيل الأسماء لـFS1 وFS2 والسنة 1، والاتفاق على مكان حفظ البطاقات", "Confirm the social worker for each class group in Y2 to Y5, who holds the cards and where they are kept. The lead in Location B is responsible for this location.": "تأكيد الأخصائي الاجتماعي لكل مجموعة فصول في السنوات 2 إلى 5، ومن يحتفظ بالبطاقات وأين تُحفَظ. ويتولى مسؤول الموقع B المسؤولية عن هذا الموقع.", "Names recorded for Y2 to Y5; card storage place agreed": "تسجيل الأسماء لـالسنوات 2 إلى 5، والاتفاق على مكان حفظ البطاقات", "Confirm the social worker for each class group in Y6 to Y9, who holds the cards and where they are kept. The lead in Location A is responsible for this location.": "تأكيد الأخصائي الاجتماعي لكل مجموعة فصول في السنوات 6 إلى 9، ومن يحتفظ بالبطاقات وأين تُحفَظ. ويتولى مسؤول الموقع A المسؤولية عن هذا الموقع.", "Names recorded for Y6 to Y9; card storage place agreed": "تسجيل الأسماء لـالسنوات 6 إلى 9، والاتفاق على مكان حفظ البطاقات", "Confirm the social worker for each class group in Y10 to Y12, who holds the cards and where they are kept. The lead in Location IGCSE is responsible for this location.": "تأكيد الأخصائي الاجتماعي لكل مجموعة فصول في السنوات 10 إلى 12، ومن يحتفظ بالبطاقات وأين تُحفَظ. ويتولى مسؤول موقع IGCSE المسؤولية عن هذا الموقع.", "Names recorded for Y10 to Y12; card storage place agreed": "تسجيل الأسماء لـالسنوات 10 إلى 12، والاتفاق على مكان حفظ البطاقات", "Start the daily report card and the 7-lesson count in Y6 to Y9: briefing for staff, cards printed, hall monitors in place, parents told. Review after 10 school days.": "بدء بطاقة التقرير اليومي والعدّ اليومي لسبع حصص في السنوات 6 إلى 9: إحاطة العاملين، وطباعة البطاقات، ووجود مراقبي الممرات، وإبلاغ أولياء الأمور. المراجعة بعد 10 أيام دراسية.", "Cards in use in Y6 to Y9; first 10-day review held": "البطاقات قيد الاستخدام في السنوات 6 إلى 9، وإجراء أول مراجعة بعد 10 أيام", "Start the daily report card and the 7-lesson count in Y10 to Y12: briefing for staff, cards printed, hall monitors in place, parents told. Review after 10 school days.": "بدء بطاقة التقرير اليومي والعدّ اليومي لسبع حصص في السنوات 10 إلى 12: إحاطة العاملين، وطباعة البطاقات، ووجود مراقبي الممرات، وإبلاغ أولياء الأمور. المراجعة بعد 10 أيام دراسية.", "Cards in use in Y10 to Y12; first 10-day review held": "البطاقات قيد الاستخدام في السنوات 10 إلى 12، وإجراء أول مراجعة بعد 10 أيام", "Start the daily report card and the 7-lesson count in Y2 to Y5: briefing for staff, cards printed, hall monitors in place, parents told. Review after 10 school days.": "بدء بطاقة التقرير اليومي والعدّ اليومي لسبع حصص في السنوات 2 إلى 5: إحاطة العاملين، وطباعة البطاقات، ووجود مراقبي الممرات، وإبلاغ أولياء الأمور. المراجعة بعد 10 أيام دراسية.", "Cards in use in Y2 to Y5; first 10-day review held": "البطاقات قيد الاستخدام في السنوات 2 إلى 5، وإجراء أول مراجعة بعد 10 أيام", "Start the daily report card and the 7-lesson count in FS1, FS2, Y1: briefing for staff, cards printed, hall monitors in place, parents told. Review after 10 school days. For FS1 and FS2 follow the decision in B-14.": "بدء بطاقة التقرير اليومي والعدّ اليومي لسبع حصص في FS1 وFS2 والسنة 1: إحاطة العاملين، وطباعة البطاقات، ووجود مراقبي الممرات، وإبلاغ أولياء الأمور. المراجعة بعد 10 أيام دراسية. وفي FS1 وFS2 يُتبَّع القرار الوارد في B-14.", "Cards in use in FS1, FS2, Y1; first 10-day review held": "البطاقات قيد الاستخدام في FS1 وFS2 والسنة 1، وإجراء أول مراجعة بعد 10 أيام", "Weekly check: the location lead and SENCO look at any pupil with 3 or more incidents on 3 days in one school week, check for unmet need (assess, plan, do, review) and hold a parent meeting.": "المراجعة الأسبوعية: ينظر مسؤول الموقع ومنسّق الاحتياجات الخاصة في أي طالب سُجّلت له 3 حوادث أو أكثر في 3 أيام خلال الأسبوع الدراسي الواحد، ويتحققان من وجود حاجة غير ملبّاة (تقييم، تخطيط، تنفيذ، مراجعة)، ويعقدان اجتماعاً مع ولي الأمر.", "Weekly check held; meetings logged (counts only here)": "إجراء المراجعة الأسبوعية، وتسجيل الاجتماعات (الأعداد فقط هنا)", "Review every pupil on a card at least every 10 school days. After 2 weeks with no improvement, the senior leader meets the parent, writes a behaviour plan and considers outside support.": "مراجعة كل طالب لديه بطاقة مرة كل 10 أيام دراسية على الأقل. وبعد أسبوعين دون تحسّن يلتقي القيادي من الإدارة العليا بولي الأمر ويكتب خطة سلوك وينظر في دعم خارجي.", "Review dates logged; plans written where needed": "تسجيل مواعيد المراجعة، وكتابة الخطط عند الحاجة", "Pilot review: social workers, hall monitors and teachers say what worked and what did not. Adjust the thresholds and the card, then reprint. The school principal signs the final thresholds.": "مراجعة التجربة: يذكر الأخصائيون الاجتماعيون ومراقبو الممرات والمعلمون ما نجح وما لم ينجح. تعديل الحدود والبطاقة ثم إعادة الطباعة. يوقّع مدير المدرسة على الحدود النهائية.", "Review notes; thresholds signed": "ملاحظات المراجعة، وتوقيع الحدود", "Look for patterns in incidents by subject, period and year group. If incidents cluster in one subject or with one teacher, support the teacher and check the kit before blaming the pupils.": "البحث عن أنماط الحوادث بحسب المادة والحصة والمرحلة الدراسية. إذا تركّزت الحوادث في مادة واحدة أو عند معلم واحد فيُدعَم المعلم وتُراجَع الحقيبة قبل لوم الطلاب.", "One-page pattern note; support actions agreed": "مذكرة من صفحة واحدة عن الأنماط، والاتفاق على إجراءات الدعم", "Teach the behaviour expectations to pupils as a short lesson each term: what each step means, what the card is for and how to earn a good day, in Arabic and English.": "تعليم الطلاب توقعات السلوك في درس قصير كل فصل دراسي: معنى كل خطوة، والغرض من البطاقة، وكيفية تحقيق يوم جيد، بالعربية والإنجليزية.", "Lesson plan; lessons delivered each term": "خطة الدرس، وتقديم الدروس كل فصل دراسي", "Termly review of behaviour data by year group, subject, SEN and attendance. Report to the school principal and check Ministry reporting rules (local rule to be confirmed).": "مراجعة بيانات السلوك كل فصل دراسي بحسب المرحلة والمادة والاحتياجات الخاصة والحضور. رفع تقرير إلى مدير المدرسة والتحقق من قواعد التقارير لدى الوزارة (القاعدة المحلية تحتاج تأكيدًا).", "Termly data note; reporting rule checked": "مذكرة بيانات فصلية، والتحقق من قاعدة التقارير", "Name a senior lead for pupil mental health and wellbeing, and set up a route to outside support through official channels.": "تسمية قيادي مسؤول عن الصحة النفسية للطلاب ورفاههم، وإنشاء مسار للدعم الخارجي عبر القنوات الرسمية.", "Named lead; route written": "تسمية المسؤول، وكتابة المسار", "Steps 1 to 3 before anything is recorded": "الخطوات من 1 إلى 3 قبل تسجيل أي شيء", "1 Reminder of the expectation. 2 Warning that states the consequence. 3 Private reset chat. Only if the behaviour continues is an incident recorded on the card.": "1 تذكير بالسلوك المتوقع. 2 تحذير يذكر العاقبة. 3 حديث خاص لإعادة الضبط. لا يُسجَّل حادث على البطاقة إلا إذا استمر السلوك.", "A lesson counts once": "تُحتسَب الحصة مرة واحدة", "A lesson counts once, however many warnings the pupil gets in it. The daily count is the number of lessons with an incident, out of 7.": "تُحتسَب الحصة مرة واحدة مهما تعددت التحذيرات فيها. العدّ اليومي هو عدد الحصص التي سُجّل فيها حادث، من أصل 7.", "Removal from the lesson": "إخراج الطالب من الحصة", "Remove a pupil only if the behaviour is serious (safety risk, abuse, serious defiance) or continues after steps 1 to 3. The hall monitor escorts the pupil to the Reflection Room. A removal counts as an incident.": "لا يُخرَج الطالب إلا إذا كان السلوك خطيراً (خطر على السلامة أو إساءة أو تحدٍّ شديد) أو استمر بعد الخطوات 1 إلى 3. يرافق مراقب الممرات الطالب إلى غرفة التأمل. ويُحتسَب الإخراج حادثاً.", "1 lesson with an incident": "حصة واحدة فيها حادث", "The teacher resolves it. The social worker sees the log. No parent contact.": "يعالجه المعلم. يطّلع الأخصائي الاجتماعي على السجل. لا اتصال بولي الأمر.", "2 lessons with an incident": "حصتان فيهما حادث", "A daily report card starts or continues. The social worker talks to the pupil. The parent sees the card.": "تبدأ بطاقة التقرير اليومية أو تستمر. يتحدث الأخصائي الاجتماعي مع الطالب. يطّلع ولي الأمر على البطاقة.", "3 lessons with an incident": "3 حصص فيها حوادث", "On the card. Lunchtime check-in. The location lead is told. The social worker messages or calls the parent the same day.": "على البطاقة. متابعة وقت الغداء. إبلاغ مسؤول الموقع. يراسل الأخصائي الاجتماعي ولي الأمر أو يتصل به في اليوم نفسه.", "4 to 5 lessons, or a second removal": "من 4 إلى 5 حصص، أو إخراج ثانٍ", "Reflection Room for the rest of the day. The location lead is told (and SENCO if the pupil has SEN). The location lead phones the parent the same day.": "غرفة التأمل لبقية اليوم. إبلاغ مسؤول الموقع (ومنسّق الاحتياجات الخاصة إن كان للطالب احتياج خاص). يتصل مسؤول الموقع بولي الأمر في اليوم نفسه.", "6 to 7 lessons, or any serious incident": "من 6 إلى 7 حصص، أو أي حادث خطير", "A senior leader (Deputy or Assistant Head), the SENCO and, if there is a welfare concern, the safeguarding lead take over. Phone the parent the same day and meet within 2 school days. Consider suspension under statutory guidance (local rule to be confirmed).": "يتولى الأمر قيادي من الإدارة العليا (نائب المدير أو مساعده) ومنسّق الاحتياجات الخاصة، ومسؤول حماية الطفل إذا كان هناك قلق على سلامة الطالب. الاتصال بولي الأمر في اليوم نفسه، والاجتماع خلال يومين دراسيين. النظر في الإيقاف وفق الإرشادات النظامية (القاعدة المحلية تحتاج تأكيدًا).", "3 days in one school week with 3 or more incidents": "3 أيام في أسبوع دراسي واحد فيها 3 حوادث أو أكثر", "The location lead and SENCO check for unmet need (assess, plan, do, review) and hold a parent meeting.": "يتحقق مسؤول الموقع ومنسّق الاحتياجات الخاصة من وجود حاجة غير ملبّاة (تقييم، تخطيط، تنفيذ، مراجعة) ويعقدان اجتماعاً مع ولي الأمر.", "2 weeks on a daily card with no improvement": "أسبوعان على البطاقة اليومية دون تحسّن", "Senior leader meeting, a written behaviour plan, and consider outside support. A pupil on a card is reviewed at least every 10 school days, and good days are shared with parents too.": "اجتماع مع القيادي من الإدارة العليا، وخطة سلوك مكتوبة، والنظر في دعم خارجي. تُراجَع حالة الطالب الحامل للبطاقة كل 10 أيام دراسية على الأقل، وتُشارَك الأيام الجيدة مع أولياء الأمور أيضاً.", "Allocated room and staffing": "الغرفة المخصصة والعاملون", "Room: [name and number to be filled in]. Staffed in every lesson by [named staff or rota to be filled in]. A hall monitor escorts the pupil and logs arrival and departure.": "الغرفة: [الاسم والرقم يُستكملان]. يتواجد فيها في كل حصة [عاملون مسمّون أو جدول يُستكمل]. يرافق مراقب الممرات الطالب ويسجّل الوصول والمغادرة.", "Education continues": "يستمر التعليم", "The subject teacher sends work and the pupil is supervised while doing it. Each placement ends with a short reintegration chat and a return-to-class plan. A pupil with SEN or a mental health need: consider a calm space with a trusted adult first, and tell the SENCO the same day.": "يرسل معلم المادة العمل ويُشرَف على الطالب أثناء إنجازه. تنتهي كل حالة بحديث قصير لإعادة الدمج وخطة للعودة إلى الفصل. الطالب ذو الاحتياج الخاص أو النفسي: يُنظَر أولاً في مكان هادئ مع شخص بالغ موثوق، ويُبلَّغ منسّق الاحتياجات الخاصة في اليوم نفسه.", "Teachers move, pupils stay": "المعلمون يتنقلون والطلاب يبقون", "Pupils stay in their classroom and teachers change over. The outgoing teacher completes the card before leaving and hands it straight to the incoming teacher. The card is never left in a room. If the next teacher has not arrived, the hall monitor holds it.": "يبقى الطلاب في فصلهم ويتبدّل المعلمون. يكمل المعلم المغادر البطاقة قبل خروجه ويسلّمها مباشرةً للمعلم القادم. لا تُترك البطاقة في الفصل أبداً. وإذا لم يصل المعلم التالي يحتفظ بها مراقب الممرات.", "PE and practical ICT": "التربية البدنية وتكنولوجيا المعلومات العملية", "Pupils move, so the card goes with them, escorted by a hall monitor. The specialist teacher hands it on. In the Reflection Room the card goes with the pupil.": "ينتقل الطلاب، فتنتقل البطاقة معهم بمرافقة مراقب الممرات. ويسلّمها المعلم المتخصص لمن بعده. وفي غرفة التأمل تذهب البطاقة مع الطالب.", "Lost card": "فقدان البطاقة", "A lost card is not an incident. The hall monitor tells the social worker and a replacement card is started and marked replacement. Earlier lessons are filled in from teacher notes.": "فقدان البطاقة ليس حادثاً. يبلّغ مراقب الممرات الأخصائي الاجتماعي وتُبدأ بطاقة بديلة وتُعلَّم بأنها بديلة. وتُستكمل الحصص السابقة من ملاحظات المعلمين.", "End of the day": "نهاية اليوم", "The social worker totals the card, initials it and logs the score. The parent signs it the next morning.": "يجمع الأخصائي الاجتماعي درجات البطاقة ويضع أحرفه الأولى ويسجّل النتيجة. يوقّعها ولي الأمر صباح اليوم التالي.", "Role and room terms": "مسميات الأدوار والغرف", "Location lead, social worker, hall monitor, Reflection Room, SENCO, safeguarding lead and senior leader match the school's own terms, in English and Arabic.": "مسؤول الموقع والأخصائي الاجتماعي ومراقب الممرات وغرفة التأمل ومنسّق الاحتياجات الخاصة ومسؤول حماية الطفل والقيادي من الإدارة العليا تطابق مسميات المدرسة نفسها بالإنجليزية والعربية.", "Local rules": "القواعد المحلية", "Removal, suspension and parent contact follow Egyptian Ministry and Directorate rules. The proposal was written from UK guidance, so each rule needs checking (local rule to be confirmed).": "يتبع الإخراج من الفصل والإيقاف والتواصل مع أولياء الأمور قواعد الوزارة والمديرية في مصر. كُتب المقترح استناداً إلى إرشادات المملكة المتحدة، لذا تحتاج كل قاعدة إلى تحقق (القاعدة المحلية تحتاج تأكيدًا).", "Seven lessons a day, and who the card is for": "سبع حصص يومياً، ولمن تُستخدم البطاقة", "The count assumes 7 lessons a day, but the 2 October 2026 timetable poster shows 8 periods a day for Years 3 to 6 (some are activity periods). Confirm the real number and whether the card applies to FS1, FS2 and Years 1 to 3.": "يفترض العدّ سبع حصص في اليوم، لكن ملصق الجدول بتاريخ 2 أكتوبر 2026 يُظهر 8 حصص يومياً للسنوات 3 إلى 6 (بعضها حصص أنشطة). يُؤكَّد العدد الفعلي، وهل تنطبق البطاقة على FS1 وFS2 والسنوات من 1 إلى 3.", "In the lesson": "داخل الحصة", "Daily count": "العدّ اليومي ومن يُبلَّغ", "Weekly and longer triggers": "محفّزات أسبوعية وأطول", "Reflection Room": "غرفة التأمل", "Card handover": "تسليم البطاقة", "Terms and local rules": "المسميات والقواعد المحلية", "Subjects": "المواد", "Roles": "الأدوار", "Behaviour": "السلوك", "Responsible": "المسؤول", "Years": "المرحلة", "Named": "الاسم", "Any year group": "أي مرحلة", "Any subject": "أي مادة", "Any responsible role": "أي دور مسؤول", "Include whole-school actions": "تضمين إجراءات المدرسة كلها", "Not applicable": "لا ينطبق", "W5 Behaviour": "W5 السلوك", "Pupil behaviour and pastoral": "سلوك الطلاب والرعاية الطلابية", "School principal, location leads, social workers, SENCO": "مدير المدرسة، مسؤولو المواقع، الأخصائيون الاجتماعيون، منسّق الاحتياجات الخاصة", "Daily report card, 7-lesson count, hall monitors, Reflection Room, parent contact, SEN link, weekly review": "بطاقة التقرير اليومية، والعدّ لسبع حصص، ومراقبو الممرات، وغرفة التأمل، والتواصل مع أولياء الأمور، وربط الاحتياجات الخاصة، والمراجعة الأسبوعية", "W5 was added from the pupil behaviour and function analysis(){
  const maxLoad = Number((S.settings.main||{}).maxLoad) || 0;
  const subj = D.subj.map(s => {
    let av = 0, nd = 0, per = 0;
    D.years.forEach(y => {
      av += getCell(cellKey("avail", y.id, sid(s))) || 0;
      nd += getCell(cellKey("need", y.id, sid(s))) || 0;
      per += (getCell(cellKey("classes", y.id)) || 0) * (getCell(cellKey("periods", y.id, sid(s))) || 0);
    });
    const tt = maxLoad && per ? Math.ceil(per / maxLoad) : null;
    return {s, av, nd, gap: (av||nd) ? nd - av : null, cov: nd ? av / nd : null, per, tt, ttgap: tt === null ? null : tt - av};
  });
  return subj;
}
function completion(){
  const n = D.years.length, m = D.subj.length;
  let filled = 0, total = n*2 + n*m*3, blocks = {A:0,B:0,C:0,D:0};
  D.years.forEach(y => {
    ["learners","classes"].forEach(b => { if (getCell(cellKey(b,y.id)) !== null){ filled++; blocks.A++; } });
    D.subj.forEach(s => { [["periods","B"],["avail","C"],["need","D"]].forEach(([b,k]) => { if (getCell(cellKey(b,y.id,sid(s))) !== null){ filled++; blocks[k]++; } }); });
  });
  return {filled, total, blocks, pct: Math.round(100 * filled / total)};
}

              ["W2","Learning continuity","Lead in each location (A, B, C, IGCSE)","Coverage map, timetable triage, cover bank, continuity kits, learning checks"],
              ["W3","Teacher capacity","Subject leads with an NQT mentor","NQT induction, subject knowledge, coaching"],
              ["W4","Resources","Resource lead","Safety sweep, inventory, sign-out, repairs"],
              ["W5","Pupil behaviour and pastoral","School principal, location leads, social workers, SENCO","Daily report card, 7-lesson count, hall monitors, Reflection Room, parent contact, SEN link, weekly review"],
              ["TP","Troubleshooting Principal and coordinator","TP","Approvals, escalation, reviews, risk, sign-off"]];
  const rh = [["Daily huddle","Before first lesson","15 minutes, standing","Three questions: what is unsafe, what is uncovered today, what is blocked. Update the attendance and coverage board"],
              ["Weekly review","End of the school week","45 minutes","Scorecard, risks, escalations, then agree no more than three priorities for next week"],
              ["Day 15 midpoint","Day 15","60 minutes","Check P1 and P2 evidence, move or drop actions"],
              ["Day 30 review","Day 30","90 minutes","Sign-off, carry forward, agree P4 owners"],

  return `
  <h2>How to use this tracker</h2>
  <ol class="steps">
    <li>Enter the <b>Day 1 date</b> at the top right. Every due date is worked out from it.</li>
    <li>Open <b>Figures</b> and fill in the yellow boxes: learners, classes, periods per week, and staff available and needed for each year group and subject.</li>
    <li>Read <b>Analysis</b> to see where teachers are missing. It updates as soon as numbers are typed.</li>

  </tbody></table></div>
  <p style="margin-top:10px" class="muted">The four audit teams now run in parallel as four workstreams under the Troubleshooting Principal (TP). Pay, coverage, materials and resources depend on each other, so waiting for one team to finish delays the critical actions.</p>
  <h3>Workstreams</h3>
  <p class="muted">W5 was added from the pupil behaviour and pastoral programme (see the Behaviour tab). It is a proposal to be reviewed.</p>
  <div class="tablewrap"><table><thead><tr><th class="l">Code</th><th class="l">Workstream</th><th class="l">Lead role</th><th class="l">Scope</th></tr></thead><tbody>
  ${ws.map(r => `<tr>${r.map((c,i)=>`<td class="l">${i===0?`<b>${c}</b>`:c}</td>`).join("")}</tr>`).join("")}

  ${rh.map(r => `<tr>${r.map((c,i)=>`<td class="l">${i===0?`<b>${c}</b>`:c}</td>`).join("")}</tr>`).join("")}

function viewDashboard(){
  const A = D.actions, ac = A.map(a => ({a, s: act(a)})).filter(x => x.s.status !== "Not applicable");
  const done = ac.filter(x => x.s.status === "Done").length;
  const late = A.filter(isLate);
  const risks = D.risks.map(riskRow);
  const red = risks.filter(r => r.rating === "RED").length;
  const comp = completion();
  const an = analysis().filter(x => x.gap > 0).sort((a,b) => b.gap - a.gap).slice(0,5);
  const rev = D.beh.filter(b => (S.review[b.id] || {}).status && S.review[b.id].status !== "Not reviewed").length;
  const bars = Object.keys(PRI).map(p => {
    const list = ac.filter(x => x.a.pri === p), d = list.filter(x => x.s.status === "Done").length, ip = list.filter(x => x.s.status === "In progress").length, bl = list.filter(x => x.s.status === "Blocked").length;
    const pct = list.length ? Math.round(100 * d / list.length) : 0;
    return `<div class="bar"><div class="lab"><span><b>${PRI[p]}</b></span><span class="muted">${d} done, ${ip} in progress, ${bl} blocked, of ${list.length} (${pct}%)</span></div><div class="track"><div class="fill ${pc(p)}" style="width:${pct}%"></div></div></div>`;
  }).join("");
  const openP1 = ac.filter(x => x.a.pri === "P1" && x.s.status !== "Done");
  const li = (a, extra) => `<li><span class="idchip ${pc(a.pri)}">${a.id}</span><span><span class="t" data-aid="${a.id}">${esc(a.text.length>110?a.text.slice(0,107)+"...":a.text)}</span><br><span class="muted"><span>${esc(a.owner)}</span>${extra?`<span>${esc(extra)}</span>`:""}</span></span></li>`;
  const byRole = D.roles.map(r => { const k = roleKey(r), mine = A.filter(a => isOpen(a) && rolesOf(a).includes(k)); return {r, open: mine.length, late: mine.filter(isLate).length}; }).filter(x => x.open).sort((a,b) => b.late - a.late || b.open - a.open).slice(0,8);
  const more = (n, shown) => n > shown ? `<li><span></span><span class="muted">and ${n-shown} more, see the Actions tab</span></li>` : "";
  return `
  <div class="grid kpis">
    <div class="kpi"><b>${ac.length?Math.round(100*done/ac.length):0}%</b><span>of ${ac.length} actions done</span></div>
    <div class="kpi"><b>${late.length}</b><span>actions past their due date</span></div>
    <div class="kpi"><b>${red}</b><span>red risks</span></div>
    <div class="kpi"><b>${comp.pct}%</b><span>of figures entered (${comp.filled} of ${comp.total})</span></div>
    <div class="kpi"><b>${rev}</b><span>of ${D.beh.length} behaviour programme items reviewed</span></div>
  </div>
  <div class="grid cols">
    <section class="panel"><h2>Progress by priority</h2><div class="bars">${bars}</div></section>
    <section class="panel"><h2>Open actions by responsible role</h2>
      ${byRole.length ? `<ul class="list">${byRole.map(x => `<li><b>${esc(x.r)}</b><span>${x.open} open, ${x.late} past due</span></li>`).join("")}</ul>` : `<p class="muted">All actions are done.</p>`}
    </section>
    <section class="panel"><h2>Biggest staffing shortfalls</h2>
      ${an.length ? `<ul class="list">${an.map(x => `<li><b>${esc(x.s)}</b><span>${fmt1(x.gap)} teachers short (${fmt1(x.av)} available, ${fmt1(x.nd)} needed)</span></li>`).join("")}</ul>` : `<p class="muted">Nothing to show yet. Enter staff available and needed on the Figures tab.</p>`}
    </section>
    <section class="panel"><h2>Open P1 actions (${openP1.length})</h2>
      ${openP1.length ? `<ul class="list">${openP1.slice(0,10).map(x => li(x.a, dueISO(x.a) ? "| due " + dueISO(x.a) : "| " + x.a.due)).join("")}${more(openP1.length,10)}</ul>` : `<p class="muted">All P1 actions are done.</p>`}
    </section>
    <section class="panel"><h2>Past their due date (${late.length})</h2>
      ${late.length ? `<ul class="list">${late.slice(0,10).map(a => li(a, "| due " + dueISO(a))).join("")}${more(late.length,10)}</ul>` : `<p class="muted">${S.settings.main && S.settings.main.day1 ? "No late actions." : "Enter the Day 1 date to see late actions."}</p>`}
    </section>
  </div>`;
}

        <div class="meta" style="margin-top:4px"><span><i>Proof of done</i> <b>${esc(a.proof)}</b></span></div></div>
      <div class="ctl">

        <div class="two"><input class="in" type="text" placeholder="Who is doing it" value="${esc(s.assignee)}" data-k="actions" data-id="${a.id}" data-f="assignee" aria-label="Assigned to for ${a.id}" ${canWrite?"":"disabled"}>

function riskRow(r){
  const d = sdoc("risks", r.id, {likelihood:r.lik, impact:r.imp, reviewDate:"", notes:""});
  const sc = (LVL.indexOf(d.likelihood)+1) * (LVL.indexOf(d.impact)+1);
  const rating = sc >= 6 ? "RED" : sc >= 3 ? "AMBER" : sc >= 1 ? "GREEN" : "";
  return Object.assign({}, r, d, {score: sc || "", rating});
}

  const dis = canWrite ? "" : "disabled";

  <div class="tablewrap"><table><thead><tr><th>#</th><th class="l">Risk</th><th>Likelihood</th><th>Impact</th><th>Score</th><th>Rating</th><th class="l">Mitigation</th><th class="l">Owner</th><th>Review date</th><th class="l">Notes</th></tr></thead><tbody>

  </tbody></table></div>`;
}

function refSection(){
