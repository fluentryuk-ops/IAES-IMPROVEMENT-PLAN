  const locs = R.locs.map(L => { const c = L.rows.reduce((t,r)=>t+r.c,0), l = L.rows.reduce((t,r)=>t+r.l,0);
    return L.rows.map((r,i) => `<tr><td class="l">${i===0?`<b>${L.label}</b>`:""}</td><td class="l">${r.y}</td><td class="c">${r.c}</td><td class="c">${f(r.l)}</td><td class="c">${fmt1(r.l/r.c)}</td></tr>`).join("") +
      `<tr class="total"><td class="l">Location total</td><td class="l">${L.rows.map(r=>r.y).join(", ")}</td><td class="c">${c}</td><td class="c">${f(l)}</td><td class="c">${fmt1(l/c)}</td></tr>`; }).join("");
  const C = R.locs.reduce((t,L)=>t+L.rows.reduce((a,r)=>a+r.c,0),0), Lr = R.locs.reduce((t,L)=>t+L.rows.reduce((a,r)=>a+r.l,0),0);
  return `<details class="ref" open><summary><b>Reference data from the school's own records</b></summary>
  <p class="muted">Figures here are read from scans and checked by adding them up (rows add to the page totals). The scans are not the live record. Staff names are not copied into this tracker. Staffing by name stays in the school's own plan file.</p>
  <h3>Class and learner numbers</h3>
  <div class="tablewrap"><table class="sticky1"><thead><tr><th class="l">Location</th><th class="l">Year</th><th>Classes</th><th>Learners</th><th>Average class size</th></tr></thead><tbody>${locs}
  <tr class="total"><td class="l">All locations</td><td class="l"></td><td class="c">${C}</td><td class="c">${f(Lr)}</td><td class="c">${fmt1(Lr/C)}</td></tr></tbody></table></div>
  <p class="muted">Source: Ministry of Education class and learner statistics for 2026/27, dated Monday 28 September 2026 (scanned page).</p>
  <p class="muted">The 6 September plan and the Ministry page differ slightly for some year groups (for example Y7 120 against 119 learners, Y12 29 against 27). The Ministry page is used here. I cannot confirm which is current.</p>
  <p class="muted">Ministry page counts 63 classes; the 6 September plan header says 64. I cannot confirm which is right.</p>
  <h3>Teaching staff headcount by role</h3>
  <div class="tablewrap"><table class="sticky1"><thead><tr><th class="l">Role</th><th>Government (permanent or seconded)</th><th>Contract</th><th>Total</th></tr></thead><tbody>
  ${R.staff.map(r=>`<tr><td class="l">${r.role}</td><td class="c">${r.gov}</td><td class="c">${r.con}</td><td class="c">${r.gov+r.con}</td></tr>`).join("")}
  <tr class="total"><td class="l">Total teaching staff, principal and stage heads</td><td class="c">${T.teachingGov}</td><td class="c">${T.teachingCon}</td><td class="c">${T.teaching}</td></tr></tbody></table></div>
  <p class="muted">Source: staff statistics for the International School 2026/27 (scanned page). Totals on the page: 317 staff, 178 teaching.</p>
  <p class="muted">Contract share: 153 of 178 teaching staff = 86%; 260 of 317 all staff = 82%.</p>
  <p class="muted">Social workers: 8 on the staff list for 63 classes and 1,608 learners (about 8 classes and 201 learners each). The behaviour programme assumes one per class group, so this is a gap to plan for.</p>
  <p class="muted">School day (2 Oct 2026 timetable poster, Years 3 to 6 only): 8 periods, 8:00 to 14:30, break 10:20 to 10:45. Periods run 40 to 50 minutes. The poster does not cover other year groups.</p></details>`;
}

function viewFigures(){
  const dis = canWrite ? "" : "disabled", comp = completion(), m = S.settings.main || {}, n = D.years.length;
  const block = (title, blk, step, max, cnt, tot) => `<h3><span>${title}</span><span class="count">${cnt} of ${tot} filled</span></h3>
    <div class="tablewrap"><table class="sticky1"><thead><tr><th class="l">Year group</th>${D.subj.map(s=>`<th>${s}</th>`).join("")}<th>Total</th></tr></thead><tbody>
    ${D.years.map(y => { let t = 0, any = false; const cells = D.subj.map(s => { const v = getCell(cellKey(blk,y.id,sid(s))); if (v!==null){t+=v;any=true;} return `<td class="c">${numInput(cellKey(blk,y.id,sid(s)),step,max,dis)}</td>`; }).join("");
      return `<tr><td class="l"><b>${y.label}</b></td>${cells}<td class="c"><b>${any?fmt1(t):""}</b></td></tr>`; }).join("")}
    ${blk==="periods"?"":`<tr class="total"><td class="l">TOTAL</td>${D.subj.map(s => { let t = 0; D.years.forEach(y => t += getCell(cellKey(blk,y.id,sid(s))) || 0); return `<td class="c">${t?fmt1(t):""}</td>`; }).join("")}<td class="c">${(() => { let t = 0; D.years.forEach(y => D.subj.forEach(s => t += getCell(cellKey(blk,y.id,sid(s))) || 0)); return t?fmt1(t):""; })()}</td></tr>`}
    </tbody></table></div>`;
  let learners = 0, classes = 0; D.years.forEach(y => { learners += getCell(cellKey("learners",y.id)) || 0; classes += getCell(cellKey("classes",y.id)) || 0; });
  return `<h2>Exact figures to collect</h2>
  ${refSection()}
  <p class="muted">Fill in every yellow box from the registrar's records and the timetable. For staff, count each teacher as a fraction of their time on that year group (0.5 if they split between two), so totals do not double count. Leave a box empty when the figure is not yet known.</p>
  <h3><span>A. Learner numbers and classes</span><span class="count">${comp.blocks.A} of ${n*2} filled</span></h3>
  <div class="tablewrap"><table class="sticky1"><thead><tr><th class="l">Year group</th><th class="l">Location</th><th>Learners (on roll)</th><th>Classes</th><th>Average class size</th></tr></thead><tbody>
  ${D.years.map(y => { const l = getCell(cellKey("learners",y.id)), c = getCell(cellKey("classes",y.id));
    return `<tr><td class="l"><b>${y.label}</b></td><td class="l">${y.loc}</td><td class="c">${numInput(cellKey("learners",y.id),1,2000,dis)}</td><td class="c">${numInput(cellKey("classes",y.id),1,50,dis)}</td><td class="c">${l!==null&&c?fmt1(l/c):""}</td></tr>`; }).join("")}
  <tr class="total"><td class="l">TOTAL</td><td class="l"></td><td class="c">${learners||""}</td><td class="c">${classes||""}</td><td class="c">${classes?fmt1(learners/classes):""}</td></tr></tbody></table></div>
  <h3>Timetable settings</h3>
  <div class="filters"><label><span>Length of one period (minutes)</span> <input class="in" type="number" min="1" max="120" step="1" value="${esc(m.periodLen||"")}" data-k="settings" data-id="main" data-f="periodLen" ${dis}></label>
  <label><span>Maximum teaching periods per teacher per week</span> <input class="in" type="number" min="1" max="60" step="1" value="${esc(m.maxLoad||"")}" data-k="settings" data-id="main" data-f="maxLoad" ${dis}></label></div>
  ${block("B. Timetable: periods per week, per class","periods",1,20,comp.blocks.B,n*D.subj.length)}
  ${block("C. Teaching staff available, per year group (FTE)","avail",0.5,20,comp.blocks.C,n*D.subj.length)}
  ${block("D. Teaching staff needed, per year group (FTE)","need",0.5,20,comp.blocks.D,n*D.subj.length)}`;
}

function viewAnalysis(){
  const an = analysis(), maxLoad = (S.settings.main||{}).maxLoad;
  const tot = an.reduce((t,x) => ({av:t.av+x.av, nd:t.nd+x.nd, per:t.per+x.per, tt:t.tt+(x.tt||0)}), {av:0,nd:0,per:0,tt:0});
  const grid = (title, f, cls) => `<h3>${title}</h3><div class="tablewrap"><table class="sticky1"><thead><tr><th class="l">Year group</th>${D.subj.map(s=>`<th>${s}</th>`).join("")}</tr></thead><tbody>
    ${D.years.map(y => `<tr><td class="l"><b>${y.label}</b></td>${D.subj.map(s => { const r = f(y.id, sid(s)); return `<td class="c ${r.c||""}">${r.t}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
  return `<h2>Staffing gap and coverage</h2>
  <p class="muted">Worked out automatically from the Figures tab. Shortfall is staff needed minus staff available: a positive number means teachers are missing.</p>
  <h3>Subject summary</h3>
  <div class="tablewrap"><table><thead><tr><th class="l">Subject</th><th>Staff available (FTE)</th><th>Staff needed (FTE)</th><th>Shortfall</th><th>Coverage</th><th>Periods needed per week (classes x periods)</th><th>${maxLoad?`<span>Staff needed from timetable</span> <span>(at ${esc(maxLoad)} periods each)</span>`:"Staff needed from timetable"}</th><th>Shortfall against timetable figure</th></tr></thead><tbody>
  ${an.map(x => `<tr><td class="l"><b>${x.s}</b></td><td class="c">${x.av?fmt1(x.av):""}</td><td class="c">${x.nd?fmt1(x.nd):""}</td><td class="c ${x.gap===null?"":x.gap>0?"bad":"good"}">${x.gap===null?"":fmt1(x.gap)}</td><td class="c">${x.cov===null?"":Math.round(x.cov*100)+"%"}</td><td class="c">${x.per||""}</td><td class="c">${x.tt===null?"":x.tt}</td><td class="c ${x.ttgap===null?"":x.ttgap>0?"bad":"good"}">${x.ttgap===null?"":fmt1(x.ttgap)}</td></tr>`).join("")}
  <tr class="total"><td class="l">ALL SUBJECTS</td><td class="c">${tot.av?fmt1(tot.av):""}</td><td class="c">${tot.nd?fmt1(tot.nd):""}</td><td class="c">${(tot.av||tot.nd)?fmt1(tot.nd-tot.av):""}</td><td class="c">${tot.nd?Math.round(100*tot.av/tot.nd)+"%":""}</td><td class="c">${tot.per||""}</td><td class="c">${tot.tt||""}</td><td class="c"></td></tr></tbody></table></div>
  <p class="muted" style="margin-top:8px">Staff needed from timetable = periods needed per week divided by the maximum periods one teacher can teach, rounded up. If it differs from the figure you entered, ask the location leads which is right. Enter the maximum on the Figures tab.</p>
  ${grid("Shortfall by year group and subject (FTE)", (y,s) => { const a = getCell(cellKey("avail",y,s)), n = getCell(cellKey("need",y,s)); if (a===null&&n===null) return {t:""}; const g = (n||0)-(a||0); return {t:fmt1(g), c:g>0?"bad":"good"}; })}
  ${grid("Coverage by year group and subject (available / needed)", (y,s) => { const a = getCell(cellKey("avail",y,s)), n = getCell(cellKey("need",y,s)); return n ? {t:Math.round(100*(a||0)/n)+"%"} : {t:""}; })}`;
}


/* ---------- Arabic layer ----------
   English stays the source text. The dictionary D.ar maps each English string to Arabic.
   Mode "both" puts the Arabic line under (blocks) or beside (inline) the English; "ar" shows Arabic only. */
const INLINE = new Set(["B","I","SPAN","BUTTON","LABEL","A","STRONG","EM"]);
const norm = h => h.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();
const PATS = D.pat.map(p => [new RegExp(p[0]), p[1]]);
function arOf(key){
  if (!key) return null;
  if (D.ar[key]) return D.ar[key];
  if (key.startsWith("| ") && !key.startsWith("| due ")){ const r = D.ar[key.slice(2)]; if (r) return "| " + r; }
  if (key.includes(", ")){ const parts = key.split(", ").map(p => D.ar[p] || D.ar[p.charAt(0).toUpperCase() + p.slice(1)]); if (parts.every(Boolean)) return parts.join("، "); }
  for (const [re, out] of PATS){ const m = key.match(re); if (m) return out.replace(/\$(\d)/g, (_,i) => m[i]); }
  return null;
}
function arText(el){
  const a = el.dataset && el.dataset.aid && D.actions.find(x => x.id === el.dataset.aid);
  if (a && D.ar[a.text]){ const s = D.ar[a.text]; return s.length > 100 ? s.slice(0,97) + "..." : s; }
  return null;
}
function apply(el){
  const ar = arText(el) || arOf(norm(el.innerHTML));
  if (!ar) return false;
  if (lang === "ar"){ el.innerHTML = `<span class="arm" dir="rtl" lang="ar">${ar}</span>`; }
  else if (INLINE.has(el.tagName)){ el.insertAdjacentHTML("beforeend", `<span class="sep"> / </span><span class="ari" dir="rtl" lang="ar">${ar}</span>`); }
  else { el.insertAdjacentHTML("beforeend", `<span class="ar" dir="rtl" lang="ar">${ar}</span>`); }
  return true;
}
const BLOCKY = "div,table,ul,ol,p,tr,article,section,h2,h3,select,input,textarea,button";
function walk(root){
  for (const el of Array.from(root.children)){
    if (/^(SCRIPT|STYLE|INPUT|TEXTAREA)$/.test(el.tagName)) continue;
    if (el.tagName === "SELECT"){
      if (el.id === "lang") continue;
      Array.from(el.options).forEach(o => { const en = o.textContent, ar = arOf(norm(en)); if (!ar) return;
        if (!o.hasAttribute("value")) o.value = en;
        o.textContent = lang === "ar" ? ar : en + " / " + ar; });
      continue;
    }
    if (el.dataset && el.dataset.aid && apply(el)) continue;
    if (!el.querySelector(BLOCKY) || el.tagName === "BUTTON"){ if (apply(el)) continue; }
    walk(el);
  }
}
const HDR = {};
function localize(){
  document.querySelectorAll("header.top h1, header.top .sub, header.top label.day > span").forEach((e,i) => { if (HDR[i] === undefined) HDR[i] = e.innerHTML; else e.innerHTML = HDR[i]; });
  if (lang === "en") return;
  ["header.top .sub","header.top h1","header.top label.day","#tabs","#banner","#view"].forEach(s => { const r = document.querySelector(s); if (!r) return;
    if (s.includes("h1") || s.includes(".sub")){ apply(r); } else walk(r); });
  document.querySelectorAll("#view [placeholder]").forEach(e => { const ar = arOf(norm(e.getAttribute("placeholder"))); if (ar) e.setAttribute("placeholder", lang === "ar" ? ar : e.getAttribute("placeholder") + " / " + ar); });
  const lbl = document.querySelector("label.lang"); if (lbl && lang !== "en"){ /* language picker keeps its own wording */ }
}

const VIEWS = {start:viewStart, dashboard:viewDashboard, actions:viewActions, subjects:viewSubjects, roles:viewRoles, behaviour:viewBehaviour, risks:viewRisks, score:viewScore, figures:viewFigures, analysis:viewAnalysis};
function render(){
  dirty = false;
  const y = window.scrollY;
  $("#tabs").innerHTML = TABS.map(t => `<button role="tab" data-tab="${t[0]}" aria-selected="${t[0]===tab}">${t[1]}</button>`).join("");
  $("#view").innerHTML = VIEWS[tab]();
  const d1 = $("#day1"); if (d1 && document.activeElement !== d1){ d1.value = (S.settings.main||{}).day1 || ""; d1.disabled = !canWrite; }
  localize();
  const ls = $("#lang"); if (ls) ls.value = lang;
  document.documentElement.setAttribute("data-lang", lang);
  window.scrollTo(0, y);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (t){ tab = t.dataset.tab; try{ history.replaceState(null,"","#"+tab); }catch(_){} render(); window.scrollTo(0,0); return; }
  const p = e.target.closest("[data-pri]"); if (p){ filt.pri = p.dataset.pri; render(); return; }
  const sp = e.target.closest("[data-sp]"); if (sp){ const [s, c] = sp.dataset.sp.split("|"); filt = {pri:"all", status:"all", ws:"all", ph:c, sj:s, resp:"all", whole:false, q:""}; tab = "actions"; render(); window.scrollTo(0,0); return; }
  const rs = e.target.closest("[data-resp]"); if (rs){ filt = {pri:"all", status:"all", ws:"all", ph:"all", sj:"all", resp:rs.dataset.resp, whole:true, q:""}; tab = "actions"; render(); window.scrollTo(0,0); return; }
  const wf = e.target.closest("[data-wsf]"); if (wf){ filt = {pri:"all", status:"all", ws:wf.dataset.wsf, ph:"all", sj:"all", resp:"all", whole:true, q:""}; tab = "actions"; render(); window.scrollTo(0,0); }
});
document.addEventListener("input", e => { if (e.target.id === "fq"){ filt.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#fq"); q.focus(); q.setSelectionRange(pos,pos); } });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "lang"){ lang = t.value; try{ localStorage.setItem("iaes_lang", lang); }catch(_){} render(); return; }
  if (t.id === "fstatus"){ filt.status = t.value; render(); return; }
  if (t.id === "fws"){ filt.ws = t.value; render(); return; }
  if (t.id === "fph"){ filt.ph = t.value; render(); return; }
  if (t.id === "fsj"){ filt.sj = t.value; render(); return; }
  if (t.id === "fresp"){ filt.resp = t.value; render(); return; }
  if (t.id === "fwhole"){ filt.whole = t.checked; render(); return; }
  const k = t.dataset.k; if (!k || !canWrite) return;
  const id = t.dataset.id, f = t.dataset.f;
  if (k === "cells"){
    const raw = t.value.trim();
    if (raw === ""){ delete S.cells[id]; save("cells/"+id, null); }
    else { const v = Number(raw); const max = Number(t.max) || 1e9;
      if (!isFinite(v) || v < 0 || v > max){ t.value = getCell(id) ?? ""; setSync("error",{code:"enter a number from 0 to "+max}); return; }
      S.cells[id] = {v}; save("cells/"+id, {v}); }
  } else {
    const col = k; const cur = Object.assign({}, S[col][id] || {});
    cur[f] = t.value;
    if (col === "actions" && f === "status" && t.value === "Done" && !cur.doneDate) cur.doneDate = todayISO();
    S[col][id] = cur; save(col+"/"+id, cur);
  }
  render();
});
document.addEventListener("focusout", () => { if (dirty) setTimeout(() => { if (dirty && !typing()) render(); }, 60); });
const typing = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== "day1" && a.closest("#view"); };
function onData(){ if (typing()) dirty = true; else render(); }

/* ---------- boot ---------- */
(async function(){
  const h = location.hash.replace("#",""); if (VIEWS[h]) tab = h;
  render();
  try { db = await claude.use("db"); } catch(_) { db = null; }
  try { const u = await claude.use("user"); if (u && u.can){ const w = u.can("data.write"); if (w === false) canWrite = false; } } catch(_) {}
  if (!db){ setSync("local");
    if (D.seed){ S.cells = Object.assign({}, D.seed.cells); S.settings = {main: Object.assign({}, D.seed.settings)}; $("#banner").innerHTML = `<div class="banner">Standalone copy. The figures shown are a snapshot from ${D.seed.date}. Changes you type stay in this browser window only and are not shared.</div>`; }
    else $("#banner").innerHTML = `<div class="banner">Sign in to the viewer to share changes. Until then anything you type stays in this window only.</div>`;
    render(); return; }
  if (!canWrite){ setSync("ro"); $("#banner").innerHTML = `<div class="banner" style="background:var(--soft);color:var(--ink)">You can view this tracker but not change it. Ask the owner for edit access.</div>`; }
  else setSync("saved");
  const sub = (col, fn) => db.collection(col).onSnapshot(snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); fn(o); onData(); }, e => setSync("error", e));
  sub("actions", o => S.actions = o); sub("risks", o => S.risks = o); sub("score", o => S.score = o);
  sub("settings", o => S.settings = o); sub("roles", o => S.roles = o); sub("review", o => S.review = o);
  db.collection("cells").onSnapshot(snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S.cells = o; onData(); }, e => setSync("error", e));
  render();
})();
</script>
